<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>プレイヤー操作 UI テスト</title>
  <style>
    :root{--teal:#5a9b97;--teal-strong:#008f83;--teal-bright:#12b7a7;--active-bg:#e1f5f2;--ink:#264a47}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#eef6f5;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
    .test-shell{width:min(960px,100%);display:grid;gap:16px}
    .notice{margin:0;color:#587976;font-size:13px;text-align:center}
    .player-card{overflow:hidden;border:1px solid #d6e5e3;border-radius:22px;background:#fff;box-shadow:0 18px 42px rgba(30,87,82,.12)}
    .mock-screen{display:grid;place-items:center;min-height:220px;padding:24px;background:linear-gradient(145deg,#eaf8f6,#d7eeeb)}
    .track{display:grid;gap:5px;text-align:center}
    .track small{color:#64847f}
    .track strong{font-size:clamp(18px,3vw,28px)}
    .time{font-variant-numeric:tabular-nums;color:#47706c}
    .controls{display:grid;grid-template-columns:repeat(7,minmax(52px,1fr));align-items:center;gap:12px;padding:22px 24px;background:#fff}
    .control{justify-self:center;display:grid;place-items:center;width:54px;height:54px;padding:12px;border:0;border-radius:50%;background:transparent;color:var(--teal);cursor:pointer;transition:background .16s,color .16s,transform .12s,box-shadow .16s}
    .control:hover{background:#eef8f7;color:var(--teal-strong)}
    .control:active{transform:scale(.92)}
    .control:focus-visible{outline:3px solid rgba(0,143,131,.3);outline-offset:3px}
    .control[aria-pressed="true"]{background:var(--active-bg);color:var(--teal-strong);box-shadow:inset 0 0 0 2px rgba(0,143,131,.12)}
    .control svg{width:30px;height:30px;overflow:visible;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .control svg text{fill:currentColor;stroke:none;font-size:7px;font-weight:800;text-anchor:middle}
    .play{width:84px;height:84px;padding:21px;color:#fff;background:linear-gradient(135deg,var(--teal-bright),#007f76);box-shadow:0 14px 28px rgba(0,111,102,.24)}
    .play:hover{color:#fff;background:linear-gradient(135deg,#18c6b5,#00736b);box-shadow:0 17px 32px rgba(0,111,102,.3)}
    .play svg{width:42px;height:42px;stroke-width:1.8}
    .play .pause-icon{display:none}
    .play.is-playing .play-icon{display:none}
    .play.is-playing .pause-icon{display:block}
    .state-line{min-height:24px;margin:0;padding:0 24px 18px;color:#587976;font-size:13px;text-align:center}
    @media(max-width:700px){
      body{padding:10px}
      .mock-screen{min-height:180px}
      .controls{gap:2px;padding:16px 6px}
      .control{width:44px;height:44px;padding:9px}
      .control svg{width:26px;height:26px}
      .play{width:62px;height:62px;padding:15px}
      .play svg{width:34px;height:34px}
    }
  </style>
</head>
<body>
  <main class="test-shell">
    <p class="notice">テストモデル：現行ver2のプレイヤーには未適用です</p>
    <section class="player-card" aria-label="プレイヤー操作UI試作">
      <div class="mock-screen">
        <div class="track">
          <small>UIプレビュー</small>
          <strong id="track-title">テスト楽曲 1</strong>
          <span id="time" class="time">0:00</span>
        </div>
      </div>
      <div class="controls" aria-label="再生操作">
        <button id="shuffle" class="control" type="button" title="ランダム再生" aria-label="ランダム再生" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3c5 0 5 10 10 10h3M17 4l3 3-3 3M4 17h3c2.2 0 3.4-1.7 4.5-3.7M16 7.2c.4-.1.7-.2 1-.2h3M17 14l3 3-3 3"/></svg>
        </button>
        <button id="previous" class="control" type="button" title="前の曲" aria-label="前の曲">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 6l-9 6 9 6z"/></svg>
        </button>
        <button id="back10" class="control" type="button" title="10秒戻る" aria-label="10秒戻る">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V3m0 4h4M5.5 16a8 8 0 1 0-.7-7"/><text x="12" y="15">10</text></svg>
        </button>
        <button id="play" class="control play" type="button" title="再生" aria-label="再生">
          <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
          <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
        </button>
        <button id="forward10" class="control" type="button" title="10秒進む" aria-label="10秒進む">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7V3m0 4h-4M18.5 16a8 8 0 1 1 .7-7"/><text x="12" y="15">10</text></svg>
        </button>
        <button id="next" class="control" type="button" title="次の曲" aria-label="次の曲">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 6l9 6-9 6z"/></svg>
        </button>
        <button id="repeat" class="control" type="button" title="1曲リピート" aria-label="1曲リピート" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l3 3-3 3M20 6H8a5 5 0 0 0-5 5M7 21l-3-3 3-3M4 18h12a5 5 0 0 0 5-5"/><text x="12" y="15">1</text></svg>
        </button>
      </div>
      <p id="state" class="state-line" role="status" aria-live="polite">停止中</p>
    </section>
  </main>
  <script>
    const state={playing:false,shuffle:false,repeat:false,seconds:0,track:1,timer:null};
    const byId=id=>document.getElementById(id);
    const formatTime=seconds=>Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');
    function render(){
      byId('track-title').textContent='テスト楽曲 '+state.track;
      byId('time').textContent=formatTime(state.seconds);
      byId('play').classList.toggle('is-playing',state.playing);
      byId('play').title=state.playing?'一時停止':'再生';
      byId('play').setAttribute('aria-label',byId('play').title);
      byId('shuffle').setAttribute('aria-pressed',String(state.shuffle));
      byId('repeat').setAttribute('aria-pressed',String(state.repeat));
      byId('state').textContent=(state.playing?'再生中':'停止中')+' ・ ランダム '+(state.shuffle?'ON':'OFF')+' ・ 1曲リピート '+(state.repeat?'ON':'OFF');
    }
    function setPlaying(value){
      state.playing=value;
      clearInterval(state.timer);
      if(value) state.timer=setInterval(()=>{state.seconds+=1;render();},1000);
      render();
    }
    byId('play').addEventListener('click',()=>setPlaying(!state.playing));
    byId('shuffle').addEventListener('click',()=>{state.shuffle=!state.shuffle;render();});
    byId('repeat').addEventListener('click',()=>{state.repeat=!state.repeat;render();});
    byId('back10').addEventListener('click',()=>{state.seconds=Math.max(0,state.seconds-10);render();});
    byId('forward10').addEventListener('click',()=>{state.seconds+=10;render();});
    byId('previous').addEventListener('click',()=>{state.track=Math.max(1,state.track-1);state.seconds=0;render();});
    byId('next').addEventListener('click',()=>{state.track+=1;state.seconds=0;render();});
    render();
  </script>
</body>
</html>
