<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#87ceeb">
  <meta name="description" content="彩興DB ver2 試験版">
  <title>彩興DB ver2</title>
  <link rel="stylesheet" href="./assets/css/app-v2-inline-history.css?v=20260802-repeat-icons">
</head>
<body>
  <main class="app">
    <header class="toolbar card">
      <div class="toolbar-row">
        <nav id="category-tabs" class="tabs" aria-label="表示区分（複数選択可）">
          <button class="tab active" data-kind="歌枠" aria-pressed="true">歌枠</button>
          <button class="tab active" data-kind="歌ってみた" aria-pressed="true">歌ってみた</button>
          <button class="tab active" data-kind="ショート" aria-pressed="true">ショート</button>
          <button class="tab" data-kind="gags" aria-pressed="false">ネタ</button>
        </nav>
        <button id="player-toggle" class="button secondary" type="button" aria-pressed="false">プレイヤー 表示</button>
      </div>
      <div class="search-row">
        <input id="search" type="search" placeholder="曲名／アーティスト名で検索" autocomplete="off">
        <span id="status" role="status" aria-live="polite">読み込み中…</span>
      </div>
    </header>

    <section id="player-shell" class="player-shell card" hidden aria-label="YouTube プレイヤー">
      <div class="video-wrap"><div id="youtube-player"></div></div>
      <div class="now-playing">
        <div class="now-playing-details">
          <small>再生中</small>
          <div class="now-playing-line">
            <strong id="now-playing">曲カードまたは再生ボタンを押してください</strong>
            <span id="now-playing-separator" class="now-playing-separator" hidden aria-hidden="true"> / </span>
            <button id="now-playing-artist" class="now-playing-artist" type="button" hidden><span id="now-playing-artist-name"></span></button>
          </div>
        </div>
      </div>
      <div class="operation-bar" aria-label="再生操作">
        <div class="transport-core" aria-label="基本再生操作">
          <button id="previous" class="icon-button" title="前の曲" aria-label="前の曲"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 6l-9 6 9 6z"/></svg></button>
          <button id="seek-back" class="icon-button" title="10秒戻る" aria-label="10秒戻る"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V3m0 4h4M5.5 16a8 8 0 1 0-.7-7"/><text x="12" y="15">10</text></svg></button>
          <button id="play-pause" class="icon-button play-pause" title="再生" aria-label="再生"><svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg><svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
          <button id="seek-forward" class="icon-button" title="10秒進む" aria-label="10秒進む"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7V3m0 4h-4M18.5 16a8 8 0 1 1 .7-7"/><text x="12" y="15">10</text></svg></button>
          <button id="next" class="icon-button" title="次の曲" aria-label="次の曲"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 6l9 6-9 6z"/></svg></button>
        </div>
        <div class="mode-controls" aria-label="再生モード">
          <button id="shuffle" class="icon-button" title="ランダム再生 オフ" aria-label="ランダム再生 オフ" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3c5 0 5 10 10 10h3M17 4l3 3-3 3M4 17h3c2.2 0 3.4-1.7 4.5-3.7M16 7.2c.4-.1.7-.2 1-.2h3M17 14l3 3-3 3"/></svg></button>
          <button id="repeat" class="icon-button" data-mode="off" title="ループ オフ" aria-label="ループ オフ" aria-pressed="false">
            <svg class="repeat-off-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l3 3-3 3M20 6H8a5 5 0 0 0-4.2 2.3M7 21l-3-3 3-3M4 18h12a5 5 0 0 0 4.2-2.3M4 4l16 16"/></svg>
            <svg class="repeat-one-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l3 3-3 3M20 6H8a5 5 0 0 0-5 5M7 21l-3-3 3-3M4 18h12a5 5 0 0 0 5-5"/><text x="12" y="15">1</text></svg>
            <svg class="repeat-all-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l3 3-3 3M20 6H8a5 5 0 0 0-5 5M7 21l-3-3 3-3M4 18h12a5 5 0 0 0 5-5"/></svg>
          </button>
        </div>
        <label class="volume">音量 <input id="volume" type="range" min="0" max="100" value="80"></label>
      </div>
    </section>

    <section id="desktop-history" class="desktop-history card" aria-label="選択した楽曲の歌唱履歴">
      <div class="desktop-history-header">
        <div>
          <small class="desktop-history-eyebrow">歌唱履歴</small>
          <h2 id="desktop-history-title" class="desktop-history-title">楽曲を選択</h2>
        </div>
        <button id="desktop-history-close" class="desktop-history-close" type="button" aria-label="履歴を閉じる" hidden>×</button>
      </div>
      <p id="desktop-history-sub" class="desktop-history-sub">左側の楽曲または履歴アイコンを選ぶと、ここに履歴を表示します。</p>
      <div id="desktop-history-list" class="desktop-history-list" aria-live="polite">
        <div class="desktop-history-status">履歴はまだ選択されていません。</div>
      </div>
    </section>

    <section class="card results">
      <p id="count" class="count"></p>
      <div id="list" class="song-list" aria-live="polite"></div>
    </section>
  </main>


  <script src="./assets/js/player-queue-v2.js" defer></script>
  <script src="./assets/js/app-v2-inline-history.js?v=20260802-desktop-layout" defer></script>
</body>
</html>
