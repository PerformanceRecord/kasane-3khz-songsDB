<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#87ceeb">
  <meta name="description" content="彩興DB ver2 試験版">
  <title>彩興DB ver2</title>
  <link rel="stylesheet" href="./assets/css/app.css">
</head>
<body>
  <main class="app">
    <header class="toolbar card">
      <div class="toolbar-row">
        <nav id="category-tabs" class="tabs" aria-label="区分">
          <button class="tab active" data-kind="ショート">ショート</button>
          <button class="tab" data-kind="歌ってみた">歌ってみた</button>
          <button class="tab" data-kind="歌枠">歌枠</button>
          <button class="tab" data-kind="gags">ネタ</button>
        </nav>
        <button id="player-toggle" class="button secondary" type="button" aria-pressed="false">プレイヤー 表示</button>
      </div>
      <div class="search-row">
        <input id="search" type="search" placeholder="曲名／アーティスト名で検索" autocomplete="off">
        <span id="status" role="status" aria-live="polite">読み込み中…</span>
      </div>
    </header>

    <section id="player-shell" class="player-shell card" hidden aria-label="YouTube プレイヤー">
      <div class="video-wrap"><div id="youtube-player"></div></div>
      <div class="now-playing">
        <div><small>再生中</small><strong id="now-playing">曲を選択してください</strong></div>
        <div class="transport" aria-label="再生操作">
          <button id="previous" title="前へ">⏮</button>
          <button id="seek-back" title="10秒戻る">−10</button>
          <button id="seek-forward" title="10秒進む">+10</button>
          <button id="next" title="次へ">⏭</button>
          <button id="shuffle" title="シャッフル" aria-pressed="false">🔀</button>
          <button id="repeat" title="リピート" aria-pressed="false">🔁</button>
          <label class="volume">音量 <input id="volume" type="range" min="0" max="100" value="80"></label>
        </div>
      </div>
    </section>

    <section class="card results">
      <p id="count" class="count"></p>
      <div id="list" class="song-list" aria-live="polite"></div>
    </section>
  </main>

  <dialog id="history-dialog">
    <button id="history-close" class="dialog-close" aria-label="閉じる">×</button>
    <h2 id="history-title">歌唱履歴</h2>
    <p id="history-status">読み込み中…</p>
    <div id="history-list"></div>
  </dialog>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="./assets/js/player.js" defer></script>
  <script src="./assets/js/app.js" defer></script>
</body>
</html>
